<title>Avance de Cobranza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface-2:#eef0fa; --surface-3:#faf9f7;
  --ink:#18151f; --ink-2:#5b5568; --ink-3:#948da3;
  --border:#e6e1ee; --border-2:#ece7f3;
  --accent:#1b4580; --accent-soft:#e8eef7; --accent-ring:#1b458033; --accent-ink:#123159;
  --good:#0ca34a; --good-soft:#e3f6ea;
  --warn:#c47a00; --warn-soft:#fdf1dc;
  --bad:#d0403b; --bad-soft:#fbe9e8;
  --neutral:#8b8598; --neutral-soft:#eeecf3;
  --shadow-sm: 0 1px 2px rgba(24,21,31,.05), 0 1px 1px rgba(24,21,31,.03);
  --shadow-md: 0 4px 16px rgba(24,21,31,.06), 0 1px 3px rgba(24,21,31,.05);
  --shadow-lg: 0 16px 48px rgba(24,21,31,.10), 0 2px 8px rgba(24,21,31,.06);
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); margin:0;}
::selection{background:var(--accent-soft); color:var(--accent-ink);}
.wrap{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  max-width:1240px; margin:0 auto; padding:48px 28px 80px;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0;}

.head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:40px;}
.head-left{display:flex; flex-direction:column; gap:10px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent-ink);}
.head h1{font-size:40px; font-weight:600; letter-spacing:-.01em; color:var(--ink);}
.head p{margin:0; color:var(--ink-2); font-size:14.5px; max-width:580px; line-height:1.5;}
.corte-badge{
  display:inline-flex; flex-direction:column; align-items:flex-end; gap:2px;
  padding:12px 18px; border-radius:14px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm);
}
.corte-badge .l{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);}
.corte-badge .v{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; color:var(--ink);}

.hero{
  background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:32px 32px 24px;
  box-shadow:var(--shadow-md); margin-bottom:28px;
}
.hero-top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.hero-top h2{font-size:22px; font-weight:600;}
.hero-legend{display:flex; gap:18px; font-size:12.5px; color:var(--ink-2); align-items:center;}
.hero-legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:-1px;}
.dot-active{background:var(--accent);}
.dot-done{background:var(--ink-3);}

.bars{display:flex; flex-direction:column; gap:10px;}
.bar-row{display:grid; grid-template-columns:72px 1fr 96px; align-items:center; gap:14px; cursor:pointer; padding:5px 8px; margin:0 -8px; border-radius:10px; transition:background .12s;}
.bar-row:hover{background:var(--surface-3);}
.bar-row.selected{background:var(--accent-soft);}
.bar-date{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-2); text-align:right;}
.bar-row.selected .bar-date{color:var(--accent-ink); font-weight:600;}
.bar-track{position:relative; height:22px; background:var(--surface-2); border-radius:7px; overflow:hidden;}
.bar-fill{position:absolute; inset:0 auto 0 0; border-radius:7px 3px 3px 7px; transition:width .5s cubic-bezier(.16,1,.3,1);}
.bar-fill.done{background:var(--ink-3); opacity:.55;}
.bar-fill.active{background:linear-gradient(90deg, var(--accent), #4b7fc9);}
.bar-n{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-2); font-weight:500;}
.bar-pct{font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; text-align:right;}

.detail-head{display:flex; align-items:center; justify-content:space-between; margin:36px 0 16px; flex-wrap:wrap; gap:10px;}
.detail-head h2{font-size:24px; font-weight:600;}
.detail-head .sub{font-size:13px; color:var(--ink-2);}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:16px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px 24px; box-shadow:var(--shadow-sm);}
.card h3{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin-bottom:16px;}
.col-4{grid-column:span 4;} .col-6{grid-column:span 6;} .col-8{grid-column:span 8;} .col-12{grid-column:span 12;}

.stat-big{font-family:'Fraunces',serif; font-size:46px; font-weight:600; line-height:1; color:var(--ink);}
.stat-sub{font-size:12.5px; color:var(--ink-2); margin-top:6px;}
.stat-row{display:flex; gap:28px; flex-wrap:wrap;}

.team-row{display:flex; align-items:center; gap:12px; margin-bottom:11px;}
.team-row:last-child{margin-bottom:0;}
.team-name{width:64px; font-size:13px; font-weight:700; color:var(--ink-2);}
.team-track{flex:1; height:14px; background:var(--surface-2); border-radius:6px; position:relative; overflow:hidden;}
.team-fill{position:absolute; inset:0 auto 0 0; border-radius:6px; background:var(--accent);}
.team-pct{width:48px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;}

.bd-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px;}
.bd-row:last-child{margin-bottom:0;}
.bd-name{width:150px; color:var(--ink-2); flex-shrink:0;}
.bd-track{flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.bd-fill{height:100%; background:var(--accent); border-radius:4px;}
.bd-pct{width:44px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-2);}
.bd-n{width:56px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-3);}

.mixbar{display:flex; height:26px; border-radius:8px; overflow:hidden; margin-bottom:14px;}
.mixbar span{height:100%;}
.mix-legend{display:flex; gap:14px 20px; flex-wrap:wrap; font-size:12px; color:var(--ink-2);}
.mix-legend .dot{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px;}
.mini-mix{display:flex; width:84px; height:10px; border-radius:4px; overflow:hidden; background:var(--surface-2);}
.mini-mix span{height:100%;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700; padding:0 8px 8px; border-bottom:1px solid var(--border);}
th.num, td.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
td{padding:9px 8px; border-bottom:1px solid var(--border-2);}
tr:last-child td{border-bottom:none;}
.rank{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--surface-2); font-size:11px; font-weight:700; color:var(--ink-2); margin-right:8px;}

.split-block{display:flex; gap:20px;}
.split-item{flex:1; padding:16px 18px; border-radius:14px; background:var(--surface-3);}
.split-item .l{font-size:12px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;}
.split-item .v{font-family:'Fraunces',serif; font-size:28px; font-weight:600;}
.split-item .n{font-size:12px; color:var(--ink-2); margin-top:4px;}

.empty-note{font-size:13px; color:var(--ink-3); font-style:italic;}

footer{margin-top:44px; padding-top:22px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-3); line-height:1.6;}

@media (max-width:760px){
  .grid{grid-template-columns:1fr;}
  .col-4,.col-6,.col-8,.col-12{grid-column:1 / -1;}
  .bar-row{grid-template-columns:52px 1fr 72px;}
  .head h1{font-size:30px;}
}
</style>

<div class="wrap">

  <div class="head">
    <div class="head-left">
      <span class="eyebrow">OCN · Growth · Cobranza</span>
      <h1>Avance de Cobranza</h1>
      <p>Progreso de calificación por corte diario ("Base NN-mmm") — cuántos casos ya tienen decisión del equipo, por Equipo, Ventana DPD y Segmento.</p>
    </div>
    <div class="corte-badge">

  <div class="hero">

  <div class="detail-head">
    <div>
      <h2 id="detailTitle"></h2>
      <div class="sub" id="detailSub"></div>
    </div>
  </div>

  <div class="grid" id="detailGrid"></div>

  <footer id="footerNote"></footer>
</div>

function renderHero(){
  const box = document.getElementById('heroBars');
  box.innerHTML = DATA.baseOrder.map(key => {
    const b = DATA.bases[key];
    const active = b.pct < 99.5;
    return `
      <div class="bar-row" data-key="${key}" onclick="selectBase('${key}')">
        <div class="bar-date">${DATA.baseShort[key]}</div>
        <div class="bar-track">
          <div class="bar-fill ${active ? 'active' : 'done'}" style="width:${b.pct}%"></div>
          <span class="bar-n">${b.total.toLocaleString('es-MX')} casos</span>
        </div>
        <div class="bar-pct">${pct(b.pct)}%</div>
      </div>`;
  }).join('');
}

function markSelected(key){
  document.querySelectorAll('.bar-row').forEach(el => el.classList.toggle('selected', el.dataset.key === key));
}

        <div class="bd-row">
          <div class="bd-name">${name}</div>
          <div class="bd-track"><div class="bd-fill" style="width:${(v.total/maxVentana*100)}%"></div></div>
          <div class="bd-pct">${pct(v.pct)}%</div>
          <div class="bd-n">${v.avanzado}/${v.total}</div>
        </div>`).join('')}
    </div>

    <div class="card col-6">
      <h3>Por segmento</h3>
      ${segmentoRows.map(([name, v]) => `
        <div class="bd-row">
          <div class="bd-name">${name}</div>
          <div class="bd-track"><div class="bd-fill" style="width:${(v.total/maxSegmento*100)}%"></div></div>
          <div class="bd-pct">${pct(v.pct)}%</div>
          <div class="bd-n">${v.avanzado}/${v.total}</div>
        </div>`).join('')}
    </div>

    <div class="card col-12">
      <h3>Mix de status calificado</h3>
      ${b.status_total ? `
        <div class="mixbar">
          ${['good','warn','bad','neutral'].map(cls => `<span style="width:${b.mix_legend[cls] || 0}%; background:${STATUS_COLOR[cls]}"></span>`).join('')}
        </div>
        <div class="mix-legend">
          ${b.status_list.map(s => `<span><span class="dot" style="background:${STATUS_COLOR[s.class]}"></span>${s.status} — ${s.count} (${pct(s.pct)}%)</span>`).join('')}
        </div>
      ` : '<div class="empty-note">Todavía sin calificaciones en este corte.</div>'}
    </div>

    <div class="card col-12">
      <h3>Por asesor</h3>
      ${renderAsesorTable(b.asesores_list)}
    </div>
  `;
}

function renderAsesorTable(list){
  if (!list.length) return '<div class="empty-note">Sin datos de asesores para este corte.</div>';
  const ranked = list.slice().sort((a,z) => (z.pct - a.pct) || (z.avanzado - a.avanzado) || (z.total - a.total));

  const mixBar = (mix) => {
    const parts = ['good','warn','bad','neutral'].map(cls => `<span style="width:${mix[cls] || 0}%; background:${STATUS_COLOR[cls]}"></span>`).join('');
    return `<div class="mini-mix" title="good ${pct(mix.good)}% · warn ${pct(mix.warn)}% · bad ${pct(mix.bad)}% · neutral ${pct(mix.neutral)}%">${parts}</div>`;
  };

  const rowsHtml = ranked.map((a,i) => `
      <tr>
        <td><span class="rank" style="${i===0 ? 'background:var(--accent);color:#fff' : ''}">${i+1}</span></td>
        <td>${a.name}</td>
        <td>Equipo ${a.equipo || '—'}</td>
        <td class="num">${a.total}</td>
        <td>${mixBar(a.mix)}</td>
        <td class="num">${pct(a.pct)}%<span style="color:var(--ink-3); font-size:11px; margin-left:5px">(${a.avanzado}/${a.total})</span></td>
      </tr>`).join('');

  return `
    <table>
      <thead><tr><th></th><th>Asesor</th><th>Equipo</th><th class="num">Casos</th><th>Status de su cartera</th><th class="num">Avance</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="empty-note" style="margin-top:12px">Casos y Avance son solo de esta base (el corte seleccionado arriba), no acumulado histórico del asesor. "Status de su cartera" es el mix bueno/en proceso/crítico/sin clasificar de lo que ese asesor ya calificó.</div>`;
}

function selectBase(key){
  markSelected(key);
  renderDetail(key);
  window.scrollTo({ top: document.getElementById('detailTitle').offsetTop - 90, behavior: 'smooth' });
}

document.getElementById('corteDate').textContent = DATA.corte;
document.getElementById('footerNote').textContent =
  `Fuente: Sheet de Cobranza, pestañas "Base NN-mmm" (solo las del esquema de segmentación nuevo, desde 29-sep-2026). "Avanzado" = caso con Status Calificado, Contacto o Comentarios ya capturado. Clasificación de etiquetas (bueno/en proceso/crítico) es un criterio propio, pendiente de confirmar con Ricardo. Se actualiza solo cada 2 horas.`;
renderHero();
const initial = DATA.baseOrder[DATA.baseOrder.length - 1];
markSelected(initial);
renderDetail(initial);
</script>
